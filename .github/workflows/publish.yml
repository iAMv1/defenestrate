# Release workflow — fully parameterized, nothing hardcoded.
# - Go toolchain version comes from go.mod (go-version-file)
# - Artifact names/versions come from the pushed tag via github.ref_name
# - Platforms live in the strategy matrix only
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            ext: .exe
          - goos: windows
            goarch: arm64
            ext: .exe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: >
          go build -trimpath
          -ldflags "-s -w
          -X main.version=${{ github.ref_name }}
          -X warden/internal/update.repoOwner=${{ github.repository_owner }}
          -X warden/internal/update.repoName=${{ github.event.repository.name }}"
          -o dist/warden-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} .

      - name: Checksums
        shell: pwsh
        working-directory: dist
        run: Get-ChildItem * | ForEach-Object { (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower() + "  " + $_.Name } | Set-Content checksums.txt

      - name: Smoke test (native arch only)
        if: matrix.goarch == 'amd64'
        shell: pwsh
        run: ./dist/warden-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} clean --dry-run

      - uses: actions/upload-artifact@v4
        with:
          name: warden-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
